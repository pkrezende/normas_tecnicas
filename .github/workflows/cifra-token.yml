name: CifraToken

on:
  push:
    paths: ["cifra-token/**", ".github/workflows/cifra-token.yml"]
  pull_request:
    paths: ["cifra-token/**", ".github/workflows/cifra-token.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: cifra-token

jobs:
  linux-openssl:
    name: Compatibilidade com openssl e token simulado (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc poppler-utils
      - run: dotnet test tests/CifraToken.Testes
      - run: dotnet build src/CifraToken.Cli -c Release
      - run: tests/interop.sh "$PWD/src/CifraToken.Cli/bin/Release/net10.0/cifratoken-cli"
      - name: Baixar e conferir as Políticas de Assinatura do ITI (CAdES v2.4 e PAdES v1.3)
        continue-on-error: true  # depende do site do ITI estar no ar
        run: |
          CLI=src/CifraToken.Cli/bin/Release/net10.0/cifratoken-cli
          $CLI politica AD-RB | tee rb.txt && grep -q "2.16.76.1.7.1.1.2.4" rb.txt
          $CLI politica AD-RT | tee rt.txt && grep -q "2.16.76.1.7.1.2.2.4" rt.txt
          $CLI politica "PAdES AD-RB" | tee prb.txt && grep -q "2.16.76.1.7.1.11.1.3" prb.txt
          $CLI politica "PAdES AD-RT" | tee prt.txt && grep -q "2.16.76.1.7.1.12.1.3" prt.txt
      - name: Gerar executáveis para Linux
        run: |
          out=publicado/CifraToken-linux-x64
          dotnet publish src/CifraToken.App -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
          dotnet publish src/CifraToken.Cli -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o $out
          cp LEIA-ME.md $out/ && rm -f $out/*.pdb
          test -x $out/CifraToken && test -x $out/cifratoken-cli
          tar -C publicado -czf publicado/CifraToken-linux-x64.tar.gz CifraToken-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CifraToken-linux
          path: cifra-token/publicado/CifraToken-linux-x64.tar.gz
          retention-days: 30

  windows:
    name: Testes e executáveis (Windows)
    needs: linux-openssl
    runs-on: windows-latest
    permissions:
      contents: write   # para publicar a Release com os .zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test tests/CifraToken.Testes
      - name: Gerar executáveis (64 e 32 bits)
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-x86") {
            $out = "publicado/CifraToken-$rid"
            dotnet publish src/CifraToken.App -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $out
            dotnet publish src/CifraToken.Cli -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -o $out
            Copy-Item LEIA-ME.md $out
            Get-ChildItem $out -Filter *.pdb | Remove-Item
            # a janela e a linha de comando precisam estar as duas no pacote (o Windows não distingue maiúsculas)
            foreach ($exe in "CifraToken.exe", "cifratoken-cli.exe") {
              if (-not (Test-Path "$out/$exe")) { throw "Falta $exe no pacote $rid" }
            }
          }
      - name: Teste de fumaça da janela (CifraToken.exe abre e continua aberto)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publicado/CifraToken-win-x64/CifraToken.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "CifraToken.exe fechou sozinho (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Teste de fumaça do executável de linha de comando com openssl
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"   # impede o Git Bash de trocar "/CN=..." por um caminho do Windows
        run: |
          set -e
          CLI=publicado/CifraToken-win-x64/cifratoken-cli.exe
          openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 2 -subj "/CN=fumaca" \
            -addext "keyUsage=critical,digitalSignature,nonRepudiation,keyEncipherment"
          echo "teste $(date)" > t.txt
          $CLI cifrar -i t.txt -o t.p7m -r c.pem
          openssl cms -decrypt -binary -inform DER -in t.p7m -recip c.pem -inkey k.pem -out t2.txt
          cmp t.txt t2.txt
          openssl cms -encrypt -binary -aes256 -in t.txt -outform DER -out u.p7m c.pem
          openssl pkcs12 -export -inkey k.pem -in c.pem -out k.pfx -passout pass:x
          CIFRATOKEN_SENHA=x $CLI decifrar -i u.p7m -o u.txt --pfx k.pfx
          cmp t.txt u.txt
          rm -f k.pem k.pfx
      - uses: actions/download-artifact@v4
        with:
          name: CifraToken-linux
          path: cifra-token/publicado
      - uses: actions/upload-artifact@v4
        with:
          name: CifraToken-windows
          path: cifra-token/publicado/
          retention-days: 30
      - name: Publicar Release com os .zip
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # versão do app (CifraToken.App.csproj) + número da compilação, para cada envio virar uma Release
          $versao = (Select-Xml -Path src/CifraToken.App/CifraToken.App.csproj -XPath "//Version").Node.InnerText
          $tag = "cifratoken-v$versao-${{ github.run_number }}"
          foreach ($rid in "win-x64", "win-x86") {
            Compress-Archive -Path "publicado/CifraToken-$rid/*" -DestinationPath "publicado/CifraToken-$rid.zip"
          }
          $notas = "Executáveis do CifraToken $versao (não precisam de instalação): cifrar, decifrar, assinar (CAdES e PDF/PAdES ICP-Brasil com carimbo do tempo, estampa de carimbo e logo) e verificar.`n`n" +
                   "- CifraToken-win-x64.zip: Windows 64 bits (o normal).`n" +
                   "- CifraToken-win-x86.zip: Windows, se o driver do token só existir em 32 bits.`n" +
                   "- CifraToken-linux-x64.tar.gz: Linux 64 bits.`n`n" +
                   "Descompacte e abra CifraToken.exe (no Linux, ./CifraToken): é a janela. cifratoken-cli é a linha de comando, para scripts. Instruções em LEIA-ME.md, dentro do pacote."
          gh release create $tag publicado/CifraToken-win-x64.zip publicado/CifraToken-win-x86.zip publicado/CifraToken-linux-x64.tar.gz `
            --target "${{ github.sha }}" --title "CifraToken $versao (compilação ${{ github.run_number }})" --notes $notas --latest
